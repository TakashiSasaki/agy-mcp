# For this host's existing antigravity-cli-watchdog.service. Keep the
# underlying watchdog command and use the same job store as the sync worker.
[Service]
Environment="AGY_MCP_STATE_DIR=%h/.local/state/agy-mcp"
ExecStart=
ExecStart=%h/go/bin/agy-mcp sync-watchdog -- %h/.hermes/scripts/antigravity-watchdog.sh
